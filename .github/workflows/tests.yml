name: Acceptance Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  acceptance-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup ddev
        uses: ddev/github-action-setup-ddev@v1

      - name: Start ddev
        run: ddev start

      - name: Install TYPO3 via composer
        run: ddev composer install

      - name: Setup TYPO3
        run: |
          ddev typo3 setup \
            --admin-user-password="${{ secrets.TYPO3_ADMIN_PASSWORD || 'admin1234!' }}" \
            --no-interaction

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: vendor/clickstorm/go-maps-ext/package-lock.json

      - name: Install Playwright
        working-directory: vendor/clickstorm/go-maps-ext
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Run acceptance tests
        working-directory: vendor/clickstorm/go-maps-ext
        env:
          TYPO3_BASE_URL: https://${{ env.DDEV_HOSTNAME }}
          TYPO3_BACKEND_USER: admin
          TYPO3_BACKEND_PASSWORD: ${{ secrets.TYPO3_ADMIN_PASSWORD || 'admin1234!' }}
        run: npx playwright test

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: vendor/clickstorm/go-maps-ext/playwright-report/
          retention-days: 7

      - name: Upload test results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: vendor/clickstorm/go-maps-ext/test-results/
          retention-days: 7
